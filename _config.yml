# GitHub Pages (Jekyll): o que fica fora do site publicado. São ferramentas de quem mantém o site.
exclude:
  - modelos
  - testes
  - scripts
  - icones-fonte
  - README.md
  - CLAUDE.md

# Pasta que o Jekyll ignora por comecar com ponto: o Android confere o app (APK) por aqui.
include:
  - .well-known
