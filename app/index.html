<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b2239">
  <title>CHECK-SELT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <!-- TESTE (03/10/2026): o app do Apps Script embutido no checkselt.com. Sem link no site até o
       Luciano aprovar login, GPS, foto, teclado e a passagem LT → SE no celular. -->
  <style>
    html,body{margin:0;height:100%;background:#0b2239;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#0b2239}
    #carregando{position:fixed;inset:0;display:grid;place-items:center;color:#b8c7d5;font:600 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}
    #carregando a{color:#5ce0a8}
  </style>
  <script src="/app-config.js?v=1.0.1"></script>
</head>
<body>
  <div id="carregando">Abrindo o CHECK-SELT…<br><small id="plano" hidden>Se não abrir, <a id="direto" href="#">abra direto</a>.</small></div>
  <iframe id="app" title="CHECK-SELT"
    allow="geolocation *; camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; web-share *"
    allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function () {
      var cfg = window.CHECKSELT_SITE_CONFIG || {};
      var url = cfg.appUrl;
      var quadro = document.getElementById('app');
      document.getElementById('direto').href = url;
      /* Repassa os mesmos parâmetros do endereço (ex.: ?app=se&lote=…) para o app. */
      if (location.search) url += (url.indexOf('?') >= 0 ? '&' : '?') + location.search.slice(1);
      quadro.src = url;
      quadro.addEventListener('load', function () { document.getElementById('carregando').style.display = 'none'; });
      setTimeout(function () { document.getElementById('plano').hidden = false; }, 12000);
    }());
  </script>
</body>
</html>
