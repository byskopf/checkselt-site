<!doctype html>
<html lang="pt-BR" data-ambiente="teste">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b2239">
  <title>CHECK-SELT (TESTE)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <!-- O app do Apps Script embutido no checkselt.com. A troca entre LT e SE é pedida pelo app por
       postMessage (contrato: docs/CHAVES_DO_APARELHO.md, seção 24, do projeto do app). -->
  <style>
    /* Instalado (tela cheia), o Android e o iPhone desenham a página por baixo das barras do sistema, e as
       áreas seguras (safe-area) não chegam dentro do quadro do Google: o quadro fica só na área livre. A faixa
       de cima fica escura (como o cabeçalho do app) e a de baixo, branca (como o rodapé). */
    html,body{margin:0;height:100%;overflow:hidden;background:#fff}
    body{background:linear-gradient(#0b2239 50%,#fff 50%)}
    /* A moldura (div) estica entre as bordas da área livre; o iframe ocupa 100% dela. (Um iframe com
       width/height auto NÃO estica pelos insets: fica no tamanho intrínseco, 300x150.) */
    #moldura{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);background:#fff}
    #app{display:block;width:100%;height:100%;border:0;background:#fff}
    /* Fica POR CIMA do quadro (que é branco) até o app terminar de carregar. */
    #carregando{position:fixed;inset:0;z-index:1;background:#fff;display:grid;place-items:center;color:#5b6b7b;font:600 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}
    #carregando a{color:#137a50;display:inline-block;padding:10px 6px}
  </style>
  <script src="/app-config.js?v=1.0.3"></script>
</head>
<body>
  <div id="carregando" role="status"><div>Abrindo o CHECK-SELT…<br><small id="plano" hidden>Se não abrir, <a id="direto" href="">tente de novo</a>.</small></div></div>
  <div id="moldura"><iframe id="app" title="CHECK-SELT"
    allow="geolocation *; accelerometer *; gyroscope *; magnetometer *; camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; web-share *"
    allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <script>
    (function () {
      var cfg = window.CHECKSELT_SITE_CONFIG || {};
      /* /app-teste/ usa o TESTE do app; /app/ usa a produção (appUrl). */
      var ambienteTeste = document.documentElement.getAttribute('data-ambiente') === 'teste';
      var base = ambienteTeste ? cfg.appUrlTeste : cfg.appUrl;
      var caminho = location.pathname.replace(/[^/]*$/, '');
      var quadro = document.getElementById('app');
      var carregando = document.getElementById('carregando');
      /* Sem a configuração (por exemplo, sem internet na primeira vez), não monta um endereço quebrado. */
      if (!base) { carregando.innerHTML = '<div>Sem conexão.<br><a href="">Tentar de novo</a></div>'; return; }

      /* O token do link de foto pode ter até 3000 caracteres (?foto=…); a consulta aceita esse tamanho. */
      function consultaValida(c) {
        return typeof c === 'string' && c.length <= 3006 && c.indexOf('#') < 0 && (c === '' || c.charAt(0) === '?');
      }
      /* A marca de=… é só da passagem do PWA antigo para o site; aqui dentro ela não vale (em navegador sem
         location.ancestorOrigins o app nem saberia que está embutido). Tira só esse par e mantém o resto. */
      function semMarca(c) {
        if (!c) return '';
        var pares = c.slice(1).split('&').filter(function (p) { return p && p.split('=')[0] !== 'de'; });
        return pares.length ? '?' + pares.join('&') : '';
      }
      function abrir(consulta) {
        quadro.src = base + consulta;
      }
      quadro.addEventListener('load', function () { carregando.style.display = 'none'; });
      setTimeout(function () { document.getElementById('plano').hidden = false; }, 12000);

      /* O app embutido pede para trocar de módulo (LT ↔ SE) sem sair do checkselt.com. */
      window.addEventListener('message', function (ev) {
        if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin)) return;
        var d = ev.data;
        if (!d || d.tipo !== 'checkselt-abrir' || !consultaValida(d.consulta)) return;
        try { ev.source.postMessage({ tipo: 'checkselt-abrindo' }, ev.origin); } catch (e) {}
        var limpa = semMarca(d.consulta);
        try { history.replaceState(null, '', caminho + limpa); } catch (e) {}
        abrir(limpa);
      });

      var inicial = consultaValida(location.search) ? semMarca(location.search) : '';
      if (inicial !== location.search) { try { history.replaceState(null, '', caminho + inicial); } catch (e) {} }
      abrir(inicial);
    }());
  </script>
</body>
</html>
