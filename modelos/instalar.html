<!doctype html>
<html lang="pt-BR" data-app="__APP__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b2239">
  <title>Instalar o CHECK-SELT__SUFIXO__</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CHECK-SELT">
  <link rel="icon" href="/favicon.svg?v=20261006" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006" sizes="180x180">
  <!-- Tela de passagem do ícone antigo para o app do checkselt.com (o app manda para cá, em _top, com a mesma
       consulta que mandaria ao /app/). Aberta já instalada, ou se o navegador disser que o app está instalado,
       segue direto para o app. -->
  <style>html.seguindo{visibility:hidden}</style>
  <script>
    (function () {
      var app = document.documentElement.getAttribute('data-app');
      function semMarca(c) {
        var pares = String(c || '').replace(/^\?/, '').split('&').filter(function (p) { return p && p.split('=')[0] !== 'de'; });
        return pares.length ? '?' + pares.join('&') : '';
      }
      var consulta = semMarca(location.search);
      if (consulta.length > 3006 || consulta.indexOf('#') >= 0) consulta = '';
      window.CHECKSELT_DESTINO = app + consulta;
      var instalado = (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
      /* Vindo do ícone ANTIGO, a página roda dentro da janela dele, que também é "standalone": não é o app novo instalado.
         Sinais: a marca de=pwa-antigo que o app manda, ou a chegada pelo app no Apps Script (referrer). */
      var doIconeAntigo = /(^|[?&])de=pwa-antigo(&|$)/.test(location.search) ||
        /^https:\/\/(script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)\//.test(document.referrer || '');
      window.CHECKSELT_DO_ICONE_ANTIGO = doIconeAntigo;
      window.CHECKSELT_SEM_MARCA = semMarca;
      window.CHECKSELT_STANDALONE = instalado;
      if (instalado && !doIconeAntigo) { document.documentElement.classList.add('seguindo'); location.replace(window.CHECKSELT_DESTINO); }
    }());
  </script>
  <style>
    :root{--fundo:#061526;--superficie:rgba(13,43,68,.82);--borda:rgba(206,230,244,.16);--texto:#f4f8fb;--suave:#b8c7d5;--verde:#5ce0a8;--verde2:#43d493}
    *{box-sizing:border-box}
    html{background:var(--fundo)}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));color:var(--texto);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 50% 0,#164566 0,#0b2239 40%,var(--fundo) 100%)}
    main{width:min(100%,440px);text-align:center}
    .logo{width:64px;height:80px;margin:0 auto 8px;display:block}
    .logo rect,.logo path{fill:none;stroke:var(--texto);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .logo .check{stroke:var(--verde)}
    h1{margin:6px 0 8px;font-size:1.6rem;line-height:1.2}
    h1 b{color:var(--verde)}
    p{margin:0 0 18px;color:var(--suave);font-size:1rem;line-height:1.55}
    .botoes{display:grid;gap:12px;margin-top:8px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 18px;border-radius:14px;font:inherit;font-size:1.05rem;font-weight:800;text-decoration:none;border:0;cursor:pointer}
    .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .primario{background:var(--verde);color:#071c2e}
    .primario:hover{background:var(--verde2)}
    .secundario{border:1px solid var(--borda);background:rgba(255,255,255,.06);color:var(--texto)}
    .passos{margin:4px 0 16px;padding:16px 16px 16px 34px;border:1px solid var(--borda);border-radius:14px;background:var(--superficie);text-align:left;color:var(--suave);line-height:1.7;font-size:.95rem}
    .passos b{color:var(--texto)}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 64 80" aria-hidden="true"><rect x="12" y="15" width="40" height="42" rx="5"/><path class="check" d="M21 37l8 8 15-17"/><path d="M32 3v12M32 57v20"/></svg>

    <section id="telaInstalar">
      <h1>Instale o <b>CHECK-SELT</b></h1>
      <p id="explicacao">O CHECK-SELT agora fica no endereço <b>checkselt.com</b>. Instale o ícone novo: depois é só abrir por ele.</p>
      <ol class="passos" id="passos" hidden></ol>
      <div class="botoes">
        <button class="btn primario" id="instalar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/></svg>Instalar o CHECK-SELT
        </button>
        <button class="btn primario" id="copiarEndereco" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span id="textoCopiar">Copiar o endereço checkselt.com</span>
        </button>
        <a class="btn secundario" id="abrirChrome" href="#" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5h8.3M9 13.8 4.9 6.6M15 13.8l-4.2 7.2"/></svg>Abrir no Chrome
        </a>
        <a class="btn secundario" id="semInstalar" href="__APP__">Usar sem instalar</a>
      </div>
    </section>

    <section id="telaPronto" hidden>
      <h1>Pronto!</h1>
      <p id="textoPronto">Abra o CHECK-SELT pelo <b>ícone novo</b> e remova o ícone antigo.</p>
      <div class="botoes">
        <a class="btn primario" id="abrirAgora" href="__APP__">Abrir agora</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var destino = window.CHECKSELT_DESTINO;
      document.getElementById('semInstalar').href = destino;
      document.getElementById('abrirAgora').href = destino;
      var passos = document.getElementById('passos');
      var pedido = null;

      var ua = navigator.userAgent || '';
      var iphone = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var dentroDeApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(ua);
      var safari = iphone && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|GSA\//i.test(ua);
      var android = !iphone && /Android/i.test(ua);
      /* Abre esta mesma página no Chrome do Android (sai da aba dentro de outro app). Sem o Chrome, fica aqui mesmo. */
      function linkChrome() {
        /* Sem a marca: no Chrome de verdade a página tem de agir normal (lá a instalação funciona). */
        return 'intent://' + location.host + location.pathname + window.CHECKSELT_SEM_MARCA(location.search) + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
      }

      function mostrarPassos(itens) {
        passos.innerHTML = itens.map(function (t) { return '<li>' + t + '</li>'; }).join('');
        passos.hidden = false;
        passos.scrollIntoView({ block: 'nearest' });
      }
      function pronto() {
        document.getElementById('telaInstalar').hidden = true;
        document.getElementById('telaPronto').hidden = false;
      }

      /* Android fora do Chrome (janela do ícone antigo, WhatsApp…): instalar não existe ali; o caminho é o Chrome. */
      var modoChromeAtivo = false;
      function modoChrome() {
        var ch = document.getElementById('abrirChrome');
        ch.href = linkChrome();
        ch.hidden = false;
        document.getElementById('instalar').hidden = true;
        modoChromeAtivo = true;
        document.getElementById('copiarEndereco').hidden = false;
        mostrarPassos(['Toque em <b>Copiar o endereço</b>, logo abaixo.',
          'Saia deste app e abra o <b>Chrome</b> pelo ícone dele.',
          'Toque na barra de endereço, <b>cole</b> e abra. Depois toque em <b>Baixar o aplicativo</b>.',
          'Se preferir, digite <b>checkselt.com</b> no Chrome. O botão <b>Abrir no Chrome</b> também pode funcionar, conforme o aparelho.']);
      }
      document.getElementById('copiarEndereco').addEventListener('click', function () {
        var endereco = 'https://checkselt.com';
        var texto = document.getElementById('textoCopiar');
        function feito() { texto.textContent = 'Copiado! Agora abra o Chrome e cole'; }
        function manual() { texto.textContent = 'No Chrome, digite: checkselt.com'; }
        try {
          if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(endereco).then(feito, manual); return; }
        } catch (e) {}
        manual();
      });
      function jaTemONovo() {
        document.getElementById('telaInstalar').hidden = true;
        document.getElementById('telaPronto').hidden = false;
        document.getElementById('textoPronto').innerHTML = 'O <b>CHECK-SELT novo</b> já está instalado neste aparelho. Abra pelo <b>ícone novo</b> e remova o antigo.';
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); pedido = e;
        /* Era o Chrome de verdade, afinal: volta o botão de instalar. */
        if (modoChromeAtivo) { modoChromeAtivo = false; document.getElementById('abrirChrome').hidden = true; document.getElementById('copiarEndereco').hidden = true; document.getElementById('instalar').hidden = false; passos.hidden = true; }
      });
      window.addEventListener('appinstalled', function () { pedido = null; pronto(); });

      /* O navegador diz que o app do site já está instalado (Chrome no Android): segue direto. */
      if (navigator.getInstalledRelatedApps) {
        navigator.getInstalledRelatedApps().then(function (apps) {
          if (!apps || !apps.length) return;
          if (window.CHECKSELT_DO_ICONE_ANTIGO) { jaTemONovo(); return; }
          document.documentElement.classList.add('seguindo'); location.replace(destino);
        }).catch(function () {});
      }

      if (window.CHECKSELT_DO_ICONE_ANTIGO) {
        if (android) {
          if (window.CHECKSELT_STANDALONE) modoChrome();
          else setTimeout(function () { if (!pedido) modoChrome(); }, 1500);
        } else if (iphone && window.CHECKSELT_STANDALONE) {
          mostrarPassos(['Abra o <b>Safari</b> e entre em <b>checkselt.com</b>.', 'Toque em <b>Baixar o aplicativo</b> e siga os passos.', 'Depois abra pelo ícone novo e remova o antigo.']);
        }
      }

      document.getElementById('instalar').addEventListener('click', function () {
        if (pedido) {
          pedido.prompt();
          pedido.userChoice.then(function (r) { if (r && r.outcome === 'accepted') pronto(); pedido = null; });
          return;
        }
        /* Android sem o pedido de instalação: quase sempre é uma aba dentro de outro app (o ícone antigo do
           CHECK-SELT, o WhatsApp…), onde instalar não existe. O caminho é levar a página para o Chrome. */
        if (android) { modoChrome(); return; }
        if (dentroDeApp) {
          mostrarPassos(['Toque nos <b>três pontinhos</b> (ou em Compartilhar) no canto da tela.',
            'No menu, escolha <b>Abrir no Chrome</b> ou <b>Abrir no navegador externo</b> (no iPhone, <b>Abrir no Safari</b>).',
            'Lá, toque de novo em <b>Instalar o CHECK-SELT</b>.']);
          return;
        }
        if (iphone && !safari) {
          mostrarPassos(['No iPhone, instale pelo <b>Safari</b>.', 'Abra <b>checkselt.com</b> no Safari e toque em <b>Baixar o aplicativo</b>.']);
          return;
        }
        if (iphone) {
          mostrarPassos(['Toque em <b>•••</b> (canto da barra do Safari) e depois em <b>Compartilhar</b>. Se o quadrado com a seta já aparecer na barra, toque direto nele.',
            'Role e toque em <b>Adicionar à Tela de Início</b>.',
            'Se aparecer <b>Abrir como App da Web</b>, deixe ligado.',
            'Toque em <b>Adicionar</b>. Depois abra pelo ícone novo e remova o antigo.']);
          return;
        }
        mostrarPassos(['Se aparecer <b>Abrir no Chrome</b> no menu, toque nele primeiro.',
          'Toque nos <b>três pontinhos</b> do Chrome, no canto da tela.',
          'Escolha <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>) e confirme.',
          'Depois abra pelo ícone novo e remova o antigo.']);
      });
    }());
  </script>
</body>
</html>
