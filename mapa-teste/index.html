<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Teste de mapa vetorial</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* PÁGINA DE PROVA (21/10/2026, pedido dele: "vamos fazer um teste"): o mapa VETORIAL do OpenFreeMap (grátis, sem chave, dados do OpenStreetMap) com o MapLibre, para comparar com o mapa do app
   — nitidez, o nome das ruas que não fica de cabeça para baixo ao girar, fluidez e bateria com o carro andando. NÃO faz parte do app: sem login, sem dado nenhum, sem gravar nada.
   VERSÃO 3: o carro tremia com o GPS real (rumo e posição crus a cada fix); agora velocidade e rumo são filtrados (ver o bloco do movimento). VERSÃO 2 (21/10/2026, depois do 1º teste no carro: "o carro parece ir quadro por quadro, uma travadeira"): na versão 1 o carro pulava a cada posição do GPS (~1 s) e só a câmera deslizava. Agora o carro e a câmera andam JUNTOS,
   quadro a quadro: a posição desenhada desliza para a posição prevista (a última do GPS + velocidade × tempo), e a câmera, o giro e o zoom saem dela a cada quadro. Estilo padrão sem prédios em 3D (Bright) e resolução limitada a 2x. */
:root{--navy:#0f2a3d;--green:#1f8a5b;--surface:#fff;--line:#d5dde5;--muted:#5b6b7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:var(--navy);background:#eef2f6}
#mapa{position:fixed;inset:0}
.barra{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px #0f2a3d22}
.aviso{font-size:13px;line-height:1.35;color:var(--muted)}
.aviso b{color:var(--navy)}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:600 15px Inter,system-ui,Arial,sans-serif;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--navy);padding:0 14px}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button.verde{background:var(--green);color:#fff;border-color:var(--green)}
input[type=range]{flex:1;min-width:120px;height:44px}
.rod{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;pointer-events:none}
.stats{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.stats b{display:block;font-size:16px}
.stats span{color:var(--muted)}
.carro{width:30px;height:54px}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:0}
</style>
</head>
<body>
<div id="mapa"></div>
<div class="barra" id="barra">
  <div class="card aviso"><b>Teste de mapa vetorial, versão 3</b> (não é o app). Gire o mapa com dois dedos ou pelo controle abaixo e veja se o <b>nome das ruas fica de pé</b>. Dirigindo, toque em <b>Seguir</b>.</div>
  <div class="card linha">
    <select id="estilo" aria-label="Estilo do mapa">
      <option value="bright">Bright</option><option value="positron">Positron (claro)</option><option value="liberty">Liberty (prédios 3D)</option><option value="dark">Escuro</option><option value="fiord">Fiord</option>
    </select>
    <button id="seguir" class="verde" type="button">Seguir meu GPS</button>
    <button id="norte" type="button">Norte</button>
  </div>
  <div class="card linha"><span style="font-weight:600">Girar</span><input id="giro" type="range" min="0" max="359" value="0" aria-label="Girar o mapa"><span id="giroTxt" style="min-width:44px;text-align:right">0°</span></div>
</div>
<div class="rod"><div class="stats">
  <div><span>quadros/s</span><b id="fps">–</b></div>
  <div><span>quadros lentos</span><b id="lentos">0</b></div>
  <div><span>zoom</span><b id="zoom">–</b></div>
  <div><span>velocidade</span><b id="vel">–</b></div>
  <div><span>pedidos do mapa</span><b id="pedidos">0</b></div>
  <div><span>bateria (queda)</span><b id="bat">–</b></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const BASE = 'https://tiles.openfreemap.org/styles/';
const $ = id => document.getElementById(id);
const mapa = new maplibregl.Map({ container: 'mapa', style: BASE + 'bright', center: [-52.4083, -28.2625], zoom: 16, bearing: 0, pitch: 0, maxPitch: 0, pixelRatio: Math.min(window.devicePixelRatio || 1, 2), attributionControl: { compact: true } });
mapa.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

/* a caminhonete do app (a mesma figura), de cima, apontando para a frente */
const caminhonete = '<svg class="carro" viewBox="0 0 36 64" aria-hidden="true"><path d="M12.5 4H23.5Q26.2 4.3 26.8 7.5L27.3 16V57Q27.3 60 24.5 60H11.5Q8.7 60 8.7 57V16L9.2 7.5Q9.8 4.3 12.5 4Z" fill="#f4f4f1" stroke="#3a4a44" stroke-width="0.9"/><path d="M13.6 5.2H22.4L22 19.6H14Z" fill="#2e7d5b"/><path d="M10.6 21.5H25.4L24 27H12Z" fill="#26343d"/><rect x="10.2" y="43.6" width="15.6" height="14.6" rx="1.2" fill="#2a2f33"/><path d="M14.6 21V62M21.4 21V62" stroke="#ee7b33" stroke-width="1.7" stroke-linecap="round"/><path d="M8.6 29H27.4M8.6 44H27.4" stroke="#4a4f52" stroke-width="1.4" stroke-linecap="round"/></svg>';
const el = document.createElement('div'); el.innerHTML = caminhonete;
const marca = new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat([-52.4083, -28.2625]).addTo(mapa);

/* estilo e giro manual */
$('estilo').addEventListener('change', e => mapa.setStyle(BASE + e.target.value));
$('giro').addEventListener('input', e => { if (!seguindo) mapa.jumpTo({ bearing: Number(e.target.value) }); });
$('norte').addEventListener('click', () => { if (!seguindo) mapa.easeTo({ bearing: 0, duration: 300 }); });
mapa.on('rotate', () => { const b = Math.round(((mapa.getBearing() % 360) + 360) % 360); $('giro').value = b; $('giroTxt').textContent = b + '°'; });
mapa.on('zoom', () => { $('zoom').textContent = mapa.getZoom().toFixed(2); });

/* O MOVIMENTO (versão 3, depois do 2º teste no carro: "o carro aparece tremendo"): o GPS de verdade tem ruído (a posição oscila alguns metros e o rumo alguns graus de um segundo para o outro), e a versão 2 o aplicava cru a cada posição nova.
   Agora: (1) a VELOCIDADE do carro é filtrada (constante de 0,8 s) e a posição desenhada anda com ela quadro a quadro, só sendo puxada de leve (constante de 1,2 s) para onde o GPS diz que ela está; (2) o RUMO tem folga de 3° (só mexe se o GPS discordar
   de verdade, como no app) e desliza (0,5 s); (3) o carro e o giro do mapa usam o MESMO rumo filtrado — o carro fica parado na tela, de frente para cima; (4) parado ou devagar, a oscilação do GPS dentro da precisão não mexe em nada. */
const RAD = Math.PI / 180;
let seguindo = false, vigia = null, pausadoAte = 0;
let fix = null, pos = null, hSuave = 0, temRumo = false, vx = 0, vy = 0, zSuave = null, semGiroManual = true;
const MS_POR_GRAU_LAT = 110574;
function normaliza(g) { return ((g % 360) + 540) % 360 - 180; }
mapa.on('movestart', e => { if (e.originalEvent) pausadoAte = Date.now() + 8000; });
function metros(lat1, lng1, lat2, lng2) { return Math.hypot((lng2 - lng1) * 111320 * Math.cos(lat1 * RAD), (lat2 - lat1) * MS_POR_GRAU_LAT); }
function aoPosicao(p) {
  const c = p.coords, v = isFinite(c.speed) && c.speed !== null ? c.speed : 0, kmh = v * 3.6;
  const h = isFinite(c.heading) && c.heading !== null && v > 1 ? c.heading : null;
  const precisao = isFinite(c.accuracy) && c.accuracy !== null ? c.accuracy : 0;
  $('vel').textContent = Math.round(kmh) + ' km/h';
  let lng = c.longitude, lat = c.latitude;
  if (fix && h === null && metros(fix.lat, fix.lng, lat, lng) < Math.max(4, precisao * 0.6)) { lng = fix.lng; lat = fix.lat; }   // parado ou a pé: a oscilação do GPS não mexe no carro
  fix = { lng, lat, t: performance.now(), v, h, kmh };
  if (!pos) pos = { lng, lat };
}
function quadroDoCarro(agora, dt) {
  if (!fix || !pos) return;
  /* a velocidade filtrada (leste/norte, m/s) */
  const aVx = fix.h !== null ? fix.v * Math.sin(fix.h * RAD) : 0, aVy = fix.h !== null ? fix.v * Math.cos(fix.h * RAD) : 0;
  const kv = 1 - Math.exp(-dt / 0.8);
  vx += (aVx - vx) * kv; vy += (aVy - vy) * kv;
  /* onde o GPS diz que o carro está agora (a última posição + a velocidade × o tempo desde ela) */
  const espera = Math.min(2.5, (agora - fix.t) / 1000);
  const gLat = fix.lat + (aVy * espera) / MS_POR_GRAU_LAT, gLng = fix.lng + (aVx * espera) / (111320 * Math.cos(fix.lat * RAD));
  if (metros(pos.lat, pos.lng, gLat, gLng) > 60) { pos.lat = gLat; pos.lng = gLng; }   // longe demais (primeira posição, túnel): vai direto
  const kc = 1 - Math.exp(-dt / 1.2);
  pos.lat += (vy * dt) / MS_POR_GRAU_LAT + (gLat - pos.lat) * kc;
  pos.lng += (vx * dt) / (111320 * Math.cos(pos.lat * RAD)) + (gLng - pos.lng) * kc;
  /* o rumo filtrado: folga de 3° e desliza em 0,5 s, pelo caminho mais curto */
  if (fix.h !== null) {
    if (!temRumo) { hSuave = fix.h; temRumo = true; }
    else { const d = normaliza(fix.h - hSuave); if (Math.abs(d) > 3) hSuave += d * (1 - Math.exp(-dt / 0.5)); }
  }
  marca.setLngLat([pos.lng, pos.lat]);
  marca.setRotation(hSuave);
  if (!seguindo || Date.now() < pausadoAte) { zSuave = null; return; }
  if (zSuave === null) zSuave = mapa.getZoom();
  const zAlvo = 18 - (18 - 16.25) * Math.min(1, Math.max(0, (fix.kmh - 20) / 60));
  const passo = 0.3 * dt, d = zAlvo - zSuave;
  zSuave += Math.abs(d) <= passo ? d : Math.sign(d) * passo;
  mapa.jumpTo({ center: [pos.lng, pos.lat], bearing: temRumo ? hSuave : mapa.getBearing(), zoom: zSuave });
}
$('seguir').addEventListener('click', () => {
  if (seguindo) {
    seguindo = false; $('seguir').textContent = 'Seguir meu GPS'; $('seguir').className = 'verde';
    mapa.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });
    if (vigia !== null) navigator.geolocation.clearWatch(vigia); vigia = null; return;
  }
  if (!navigator.geolocation) { alert('Este aparelho não tem GPS no navegador.'); return; }
  seguindo = true; $('seguir').textContent = 'Parar'; $('seguir').className = 'on';
  mapa.setPadding({ top: Math.round(innerHeight * 0.45), bottom: 0, left: 0, right: 0 });   // o carro fica no terço de baixo, com a rua à frente à mostra
  vigia = navigator.geolocation.watchPosition(aoPosicao, e => { alert('GPS: ' + e.message); }, { enableHighAccuracy: true, maximumAge: 0 });
});
window.__prova = { aoPosicao, pos: () => pos, mapa, marca };   // só para conferir a página por fora

/* medidas: quadros por segundo, quadros lentos (> 50 ms), pedidos de ladrilho e queda da bateria */
let ult = performance.now(), quadros = 0, lentos = 0, desde = ult;
function laco(t) {
  const dt = t - ult; ult = t; quadros++; if (dt > 50) lentos++;
  quadroDoCarro(t, Math.min(dt, 100) / 1000);
  if (t - desde >= 1000) { $('fps').textContent = Math.round(quadros * 1000 / (t - desde)); $('lentos').textContent = lentos; quadros = 0; desde = t; }
  requestAnimationFrame(laco);
}
requestAnimationFrame(laco);
try { let n = 0; new PerformanceObserver(l => { n += l.getEntries().filter(x => /openfreemap\.org/.test(x.name)).length; $('pedidos').textContent = n; }).observe({ type: 'resource', buffered: true }); } catch (e) { /* sem suporte */ }
try { navigator.getBattery().then(b => { const i = b.level; const mostra = () => { $('bat').textContent = Math.round((i - b.level) * 100) + ' pp'; }; b.addEventListener('levelchange', mostra); mostra(); }); } catch (e) { /* sem suporte */ }
</script>
</body>
</html>
